<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="#121824"/><stop offset="1" stop-color="#080a0f"/></linearGradient><linearGradient id="a" x2="0" y2="1"><stop stop-color="#ffc452"/><stop offset="1" stop-color="#e98c00"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.k{font:700 13px Arial;letter-spacing:2px;fill:#8290a8}.t{font:800 25px Arial;fill:#f3f1eb}.c{font:16px Arial;fill:#a9b3c5}.panel{fill:url(#b);stroke:#2c3648;stroke-width:2}.card{fill:#10151e;stroke:#313d51;stroke-width:2}.a{fill:#ffae18}.at{fill:#ffae18}</style></defs>
<rect width="1800" height="1120" fill="#07090d"/><text x="70" y="76" class="k" fill="#ffae18">RS-691 / RESPONSIVE CONTROL SYSTEM</text><text x="70" y="124" class="t" font-size="40">One web control system — reflowed, not replaced</text><text x="70" y="159" class="c">Keep the desktop’s machinery at large widths; cross-fade the same state into buttons, tabs, and a compact utility bar as space tightens.</text>
