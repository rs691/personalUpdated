<!-- motion legend --> <g transform="translate(70 875)"><rect width="1660" height="178" rx="20" fill="#10151e" stroke="#2c3648" stroke-width="2"/><text x="26" y="40" class="k" fill="#ffae18">MOTION SPEC / FRAMER MOTION</text><g transform="translate(26 66)"><rect width="360" height="82" rx="13" class="card"/><text x="19" y="30" class="k">LAYOUT REFLOW</text><text x="19" y="57" class="c">layout + spring: stiffness 260, damping 28</text></g><g transform="translate(414 66)"><rect width="360" height="82" rx="13" class="card"/><text x="19" y="30" class="k">CONTROL SWAP</text><text x="19" y="57" class="c">AnimatePresence: opacity + y 8, 180ms</text></g><g transform="translate(802 66)"><rect width="360" height="82" rx="13" class="card"/><text x="19" y="30" class="k">CHANNEL CHANGE</text><text x="19" y="57" class="c">slide 20px + fade; respect reduced motion</text></g><g transform="translate(1190 66)"><rect width="440" height="82" rx="13" class="card"/><text x="19" y="30" class="k">FEED PROGRESS</text><text x="19" y="57" class="c">motion.div scaleX; transform-origin left</text></g></g>
